<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윤리 규칙 판정 설명</title>
<style>
:root{
  color-scheme: light;
  --paper:#EEF1F4; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#18202B; --muted:#5E6875; --line:#D5DBE1;
  --accent:#0B7285; --accent-soft:rgba(11,114,133,.12); --viol:#B4233C; --safe:#7D8896; --ok:#2F855A;
  --c1:#4C51BF; --c2:#B7791F; --c3:#0B7285; --c4:#B4233C;
  --m1:#6B46C1; --m2:#B7791F; --m3:#2B6CB0; --m4:#C05621;
  --warn-bg:#FFF4E5; --warn-ink:#7A4A00;
  --heat:180,35,60; --cool:11,114,133;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#11151B; --surface:#1A2029; --sunk:#151A21; --ink:#E6EAF0; --muted:#9AA5B3; --line:#2C3542;
    --accent:#3BC0D4; --accent-soft:rgba(59,192,212,.16); --viol:#F2668B; --safe:#7D8896; --ok:#5CC99A;
    --c1:#8D92F5; --c2:#E3B04B; --c3:#3BC0D4; --c4:#F2668B;
    --m1:#B794F4; --m2:#E3B04B; --m3:#63B3ED; --m4:#F6AD55;
    --warn-bg:#2B2213; --warn-ink:#F3C77A;
    --heat:242,102,139; --cool:59,192,212;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#11151B; --surface:#1A2029; --sunk:#151A21; --ink:#E6EAF0; --muted:#9AA5B3; --line:#2C3542;
  --accent:#3BC0D4; --accent-soft:rgba(59,192,212,.16); --viol:#F2668B; --safe:#7D8896; --ok:#5CC99A;
  --c1:#8D92F5; --c2:#E3B04B; --c3:#3BC0D4; --c4:#F2668B;
  --m1:#B794F4; --m2:#E3B04B; --m3:#63B3ED; --m4:#F6AD55;
  --warn-bg:#2B2213; --warn-ink:#F3C77A;
  --heat:242,102,139; --cool:59,192,212;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px 0}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 0 10px;border-top:1px solid var(--line)}
.filters label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
select,input[type=number],input[type=text],textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
textarea{width:100%;min-height:70px}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{border:0;border-bottom:3px solid transparent;background:none;border-radius:0;padding:8px 14px;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px 20px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.layout{padding:12px 16px}header{padding:12px 16px 0}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;min-width:0}
.card h2{font-size:14px;margin:0 0 8px}
.card h3{font-size:13px;margin:12px 0 6px}
.q{color:var(--muted);font-size:12.5px;margin:-4px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.grow{flex:1 1 320px;min-width:0}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px 12px;min-width:110px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sel td{background:var(--accent-soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.scroll{max-height:320px;overflow:auto}
.hint{font-size:12px;color:var(--muted)}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:6px 10px;font-size:12.5px;margin:6px 0}
.chip{display:inline-block;font-size:11px;border-radius:10px;padding:1px 7px;background:var(--sunk);border:1px solid var(--line)}
.chip.v{background:rgba(var(--heat),.12);color:var(--viol);border-color:transparent}
.chip.s{color:var(--muted)}
.chip.ok{color:var(--ok)}
.chip.bad{color:var(--viol)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
svg text{font-family:inherit}
.blur{filter:blur(5px);cursor:pointer;user-select:none}
.textbox{white-space:pre-wrap;background:var(--sunk);border-radius:6px;padding:8px;font-size:12.5px;max-height:240px;overflow:auto;margin:4px 0 8px}
.side{position:sticky;top:10px}
@media (max-width:1100px){.side{position:static}}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin:4px 0}
.bar{cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.modal .card{max-width:760px;width:100%;max-height:90vh;overflow:auto;margin:0}
.steps li{margin:2px 0}
.steps li.hit{font-weight:600}
.status{font-size:12px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.slider{display:flex;align-items:center;gap:8px;font-size:12.5px}
.slider input[type=range]{width:180px}

</head>
<body>
<header>
  <h1>AI 윤리 규칙 위반 판정 설명</h1>
  <p class="sub">규칙 찾기 · 판정 비교 · 잘못된 판정 진단 · 수정 효과 확인 <span id="built"></span></p>
  <div class="filters" id="filters">
    <label>출처 <select id="fSrc"><option value="all">전체</option><option value="dna">Do-Not-Answer</option><option value="jigsaw">Jigsaw</option><option value="prosocial">ProsocialDialog</option></select></label>
    <label>분할 <select id="fSplit"><option value="dev">dev</option></select></label>
    <label id="testWrap" hidden><input type="checkbox" id="fTest"> test 열기</label>
    <label>규칙 <select id="fRule"><option value="all">전체</option></select></label>
    <label>판정 모델 <select id="fModel"></select></label>
    <label>판정 결과 <select id="fResult"><option value="all">전체</option><option value="ok">맞음</option><option value="bad">틀림</option></select></label>
    <label>판정 조건 <select id="fCond"></select></label>
    <label>팀 판정기 <select id="fTeam"></select></label>
    <label>임계값 기준 <select id="fThr"><option value="kappa">dev κ 최대</option><option value="f1">dev F1 최대</option></select></label>
    <span class="status" id="srv"></span>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-t="p1">P1 규칙 찾기</button>
    <button class="tab" data-t="p2">P2 판정 비교</button>
    <button class="tab" data-t="p3">P3 잘못된 판정 진단</button>
    <button class="tab" data-t="p4">P4 수정 효과 확인</button>
  </nav>
</header>
<div class="layout">
  <main id="main"></main>
  <aside class="side"><div class="card" id="detail"></div></aside>
</div>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>

<script id="data" type="application/json">/*__DATA__*/{}</script>
<script>
"use strict";
// ======================================================================= 데이터
const D = JSON.parse(document.getElementById('data').textContent);
const TX = D.texts, N = TX.id.length;
const IDX = new Map(TX.id.map((t, i) => [t, i]));
const NODE = new Map(D.nodes.map(n => [n.id, n]));
const MODELS = ['llamaguard', 'qwen3guard', 'shieldgemma', 'team'];
const MNAME = {llamaguard: 'Llama Guard 3', qwen3guard: 'Qwen3Guard', shieldgemma: 'ShieldGemma', team: '팀 판정기'};
const MCOL = {llamaguard: 'var(--m1)', qwen3guard: 'var(--m2)', shieldgemma: 'var(--m3)', team: 'var(--m4)'};
const RULE_FREE = new Set(['llamaguard', 'qwen3guard']);
const CONDS = ['base', 'excluded', 'rule_only', 'rule_example'];
const CNAME = {base: '기본', excluded: '규칙 제외', rule_only: '규칙 문장만', rule_example: '규칙 문장 + 예시', none: '(규칙 없음)'};
const CAUSES = {1: '규칙 찾기 문제', 2: '라벨 확인 필요', 3: '규칙 문장 문제', 4: '판정 모델 문제'};
const CCOL = {1: 'var(--c1)', 2: 'var(--c2)', 3: 'var(--c3)', 4: 'var(--c4)'};
const SRCNAME = {dna: 'Do-Not-Answer', jigsaw: 'Jigsaw', prosocial: 'ProsocialDialog'};
const TOP = D.meta.top || 5, DELTA = 0.02, MIN_N = 5;
const API = location.protocol.startsWith('http') ? '' : 'http://127.0.0.1:8765';

const TREE = {};
for (const src of ['dna', 'jigsaw']) {
  const ns = D.nodes.filter(n => n.src === src);
  if (!ns.length) continue;
  const t = {src, ids: ns.map(n => n.id), level: {}, parent: {}, children: {}, maxLv: 0};
  ns.forEach(n => { t.level[n.id] = n.lv; t.parent[n.id] = n.par; t.children[n.id] = []; t.maxLv = Math.max(t.maxLv, n.lv); });
  ns.forEach(n => { if (n.par) t.children[n.par].push(n.id); });
  t.leaves = ns.filter(n => !t.children[n.id].length).map(n => n.id);
  t.atLevel = lv => { lv = Math.min(lv, t.maxLv); return t.ids.filter(id => t.level[id] === lv); };
  t.path = id => { const o = []; while (id) { o.push(id); id = t.parent[id]; } return o.reverse(); };
  t.unitOf = leaf => { const p = t.path(leaf); return p.length > 1 ? p[1] : p[0]; };
  t.leavesUnder = id => t.children[id].length ? t.children[id].flatMap(c => t.leavesUnder(c)) : [id];
  t.units = t.ids.filter(id => t.level[id] === Math.min(2, t.maxLv));
  const S = D.sims[src];
  if (S) {
    t.col = Object.fromEntries(S.cols.map((c, j) => [c, j])); t.nc = S.cols.length;
    const bin = atob(S.b64), u8 = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
    t.vals = new Float32Array(u8.buffer); t.rowOf = new Map(S.rows.map((r, k) => [r, k]));
  }
  TREE[src] = t;
}

// ======================================================================= 계산 (analysis.py와 같은 정의)
function simOf(i, edit) {                       // i번 텍스트의 노드 → 유사도 함수. edit = 규칙 문장 수정안
  const src = TX.src[i], t = TREE[src];
  if (!t || !t.rowOf) return null;
  const k = t.rowOf.get(i);
  if (k === undefined) return null;
  const off = k * t.nc;
  if (edit && edit.src === src && edit.sims.has(i)) {
    const node = edit.rule, v = edit.sims.get(i);
    return n => n === node ? v : t.vals[off + t.col[n]];
  }
  return n => t.vals[off + t.col[n]];
}
function bfs(src, sim, tau, start = 2, exclude = null, boost = null) {
  const t = TREE[src], ex = exclude || new Set();
  let add = null;
  if (boost && boost.node && boost.v) {
    add = new Map(); const st = [boost.node];
    while (st.length) { const n = st.pop(); add.set(n, boost.v); st.push(...t.children[n]); }
  }
  const sc = add ? (n => sim(n) + (add.get(n) || 0)) : sim;
  let frontier = t.atLevel(start).filter(n => !ex.has(n));
  const leaves = [], kept = {}, compared = new Set(); let ncmp = 0, fb = false;
  while (frontier.length) {
    ncmp += frontier.length; frontier.forEach(n => compared.add(n));
    let keep = frontier.filter(n => sc(n) >= tau);
    if (!keep.length) { keep = [frontier.reduce((a, b) => sc(b) > sc(a) ? b : a)]; fb = true; }
    kept[t.level[keep[0]]] = new Set(keep);
    const nxt = [];
    for (const n of keep) {
      const kids = t.children[n].filter(c => !ex.has(c));
      if (kids.length) nxt.push(...kids); else if (!t.children[n].length) leaves.push(n);
    }
    frontier = nxt;
  }
  leaves.sort((a, b) => sc(b) - sc(a));
  return {leaves, ncmp, kept, compared, fb, sc};
}
function searchOne(i, tau, start, opts = {}) {     // rule_search.py의 한 행
  const src = TX.src[i], t = TREE[src], sim = simOf(i, opts.edit);
  if (!sim) return null;
  const r = bfs(src, sim, tau, start, opts.exclude, opts.boost);
  const gold = TX.gold[i], gp = gold ? t.path(gold) : [];
  const top1 = r.leaves[0], fp = top1 ? t.path(top1) : [];
  let div = '일치';
  for (let l = 0; l < gp.length; l++) if (fp[l] !== gp[l]) { div = 'L' + (l + 1); break; }
  let lost = '남음';
  for (let l = 0; l < gp.length; l++) if (r.kept[l + 1] && !r.kept[l + 1].has(gp[l])) { lost = 'L' + (l + 1); break; }
  const branches = [];
  for (const leaf of r.leaves) { const p = t.path(leaf), b = p.length > 2 ? p[1] : leaf; if (!branches.includes(b)) branches.push(b); }
  const gb = gp.length > 2 ? gp[1] : gold;
  const rank = r.leaves.indexOf(gold) + 1;
  return {...r, top1, gold, goldRank: rank || null, ok1: top1 === gold, ok3: rank > 0 && rank <= 3,
          l2rank: branches.indexOf(gb) + 1 || null, div, lost, eff: r.ncmp / t.ids.length};
}
function auc(p, y) {
  const n = p.length; let P = 0; for (const v of y) P += v; const Q = n - P;
  if (!P || !Q) return NaN;
  const o = [...p.keys()].sort((a, b) => p[a] - p[b]); let sumR = 0;
  for (let i = 0; i < n;) { let j = i; while (j + 1 < n && p[o[j + 1]] === p[o[i]]) j++; const avg = (i + j) / 2 + 1;
    for (let k = i; k <= j; k++) if (y[o[k]]) sumR += avg; i = j + 1; }
  return (sumR - P * (P + 1) / 2) / (P * Q);
}
function avgPrec(p, y) {
  let P = 0; for (const v of y) P += v; if (!P) return NaN;
  const o = [...p.keys()].sort((a, b) => p[b] - p[a]); let tp = 0, fp = 0, prevR = 0, s = 0;
  for (let i = 0; i < o.length;) { let j = i; while (j + 1 < o.length && p[o[j + 1]] === p[o[i]]) j++;
    for (let k = i; k <= j; k++) y[o[k]] ? tp++ : fp++; const R = tp / P; s += (R - prevR) * tp / (tp + fp); prevR = R; i = j + 1; }
  return s;
}
function kappa2(a, b) {                          // 두 이진 판정의 Cohen's κ
  const n = a.length; if (!n) return NaN; let po = 0, pa = 0, pb = 0;
  for (let i = 0; i < n; i++) { po += a[i] === b[i]; pa += a[i]; pb += b[i]; }
  po /= n; pa /= n; pb /= n; const pe = pa * pb + (1 - pa) * (1 - pb);
  return pe >= 1 ? NaN : (po - pe) / (1 - pe);
}
function metrics(p, y, thr) {
  const pred = p.map(v => v >= thr ? 1 : 0); let tp = 0, fp = 0, fn = 0;
  for (let i = 0; i < p.length; i++) { if (pred[i] && y[i]) tp++; else if (pred[i]) fp++; else if (y[i]) fn++; }
  const both = y.some(v => v) && y.some(v => !v);
  return {n: p.length, pos: y.reduce((a, b) => a + b, 0), auc: auc(p, y), ap: avgPrec(p, y), thr,
          f1: tp ? 2 * tp / (2 * tp + fp + fn) : 0, prec: tp + fp ? tp / (tp + fp) : 0, rec: tp + fn ? tp / (tp + fn) : 0,
          kappa: both && pred.some(v => v) && pred.some(v => !v) ? kappa2(y, pred) : NaN, fn, fp,
          err: p.length ? (fn + fp) / p.length : NaN};
}
function bestThr(p, y, crit) {                    // common.best_f1_threshold / analysis.best_kappa_threshold
  const n = p.length, pos = y.reduce((a, b) => a + b, 0);
  if (!pos || (crit === 'kappa' && pos === n) || !n) return 0.5;
  const o = [...p.keys()].sort((a, b) => p[b] - p[a] || a - b);
  let tp = 0, fp = 0, best = -Infinity, bt = 0.5;
  for (let i = 0; i < n; i++) {
    y[o[i]] ? tp++ : fp++;
    if (i + 1 < n && p[o[i + 1]] === p[o[i]]) continue;
    let s;
    if (crit === 'kappa') { const pp = tp + fp, po = (tp + (n - pos - fp)) / n, pe = (pp * pos + (n - pp) * (n - pos)) / (n * n); s = pe < 1 ? (po - pe) / (1 - pe) : 0; }
    else s = 2 * tp / (2 * tp + fp + (pos - tp));
    if (s > best) { best = s; bt = p[o[i]]; }
  }
  return bt;
}

// ======================================================================= 상태
const S = {
  tab: 'p1', sel: null, testOpen: false,
  f: {src: 'all', split: 'dev', rule: 'all', model: 'team', result: 'all'},
  cond: 'base', team: D.meta.variants.includes('team_v3') ? 'team_v3' : D.meta.variants[D.meta.variants.length - 1], thrBy: 'kappa',
  p1: {src: 'dna', tau: {...D.meta.tau}, start: D.meta.start_level || 2, mode: 'sim', k: 1, node: null},
  p2: {group: 'rule', a: 'llamaguard', b: 'team', cell: null},
  p3: {model: 'team', k: TOP, cause: null, brush: null},
  p4: {model: 'team', src: 'dna', thr: null, tau: null, bnode: '', bv: 0, unit: null, rule: null, edit: null, busy: false},
  server: false,
};
try { const t = localStorage.getItem('sys_tab'); if (t) S.tab = t; } catch (e) {}

const realModel = m => m === 'team' ? S.team : m;
function pOf(m, cond, i) {
  const k = realModel(m), J = D.judg[k];
  if (!J) return null;
  const arr = RULE_FREE.has(m) ? J.none : J[cond];
  return arr ? arr[i] : null;
}
const THR = new Map();
function thrOf(src, m, cond) {                    // dev에서 고른 임계값 (필터와 상관없이 고정)
  const c = RULE_FREE.has(m) ? 'none' : cond, key = [src, realModel(m), c, S.thrBy].join('|');
  if (!THR.has(key)) {
    const p = [], y = [];
    for (let i = 0; i < N; i++) if (TX.src[i] === src && TX.split[i] === 'dev') { const v = pOf(m, cond, i); if (v != null) { p.push(v); y.push(TX.y[i]); } }
    THR.set(key, p.length ? bestThr(p, y, S.thrBy) : 0.5);
  }
  return THR.get(key);
}
function predOf(m, cond, i) { const v = pOf(m, cond, i); return v == null ? null : (v >= thrOf(TX.src[i], m, cond) ? 1 : 0); }
function inFilter(i, o = {}) {
  const f = S.f;
  if (TX.split[i] === 'test' && !S.testOpen) return false;
  if (f.split !== 'all' && TX.split[i] !== f.split) return false;
  if (f.src !== 'all' && TX.src[i] !== f.src) return false;
  if (f.rule !== 'all' && TX.unit[i] !== f.rule) return false;
  if (o.judged && !TX.judged[i]) return false;
  if (f.result !== 'all' && !o.noResult) {
    const pr = predOf(f.model, S.cond, i); if (pr == null) return false;
    if ((f.result === 'ok') !== (pr === TX.y[i])) return false;
  }
  return true;
}
const filtered = o => { const out = []; for (let i = 0; i < N; i++) if (inFilter(i, o)) out.push(i); return out; };
const fmt = (v, d = 3) => v == null || Number.isNaN(v) ? '–' : (+v).toFixed(d);
const pct = v => v == null || Number.isNaN(v) ? '–' : (v * 100).toFixed(1) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

function p1Tree(src, sr, res, ids) {
  const t = TREE[src], W = 880, cols = t.maxLv, colW = src === 'dna' ? [150, 250, 480] : [180, 700];
  const leafH = src === 'dna' ? 15 : 60, H = t.leaves.length * leafH;

  const place = id => { if (!t.children[id].length) { y0[id] = y; hh[id] = leafH; y += leafH; return; } const s = y; t.children[id].forEach(place); y0[id] = s; hh[id] = y - s; };
  t.ids.filter(id => t.level[id] === 1).forEach(place);
  const x0 = [0]; for (let l = 1; l < cols; l++) x0.push(x0[l - 1] + colW[l - 1]);
  const goldP = sr ? new Set(t.path(sr.gold)) : null, topP = sr && sr.top1 ? new Set(t.path(sr.top1)) : null;
  let agg = null;
  if (!sr && S.p1.mode === 'agg' || S.p1.mode === 'agg') {
    agg = {}; const k = S.p1.k;

    if (hgt >= 11) g += `<text x="${x + 5}" y="${yy + Math.min(hgt / 2, 12) + 4}" font-size="11" fill="var(--ink)">${esc(short(nname(id), Math.floor((w - valW) / 6.4)))}</text>${val ? `<text x="${x + w - 5}" y="${yy + Math.min(hgt / 2, 12) + 4}" font-size="10.5" text-anchor="end" fill="var(--ink)">${val}</text>` : ''}`;
    g += '</g>';
  }
  const lab = src === 'dna' ? ['대분류', '중분류 (위해 유형)', '소분류 (규칙)'] : ['대분류', '규칙'];
  const head = lab.map((s, l) => `<text x="${x0[l] + 4}" y="-6" font-size="11.5" fill="var(--muted)">${s}${l + 1 < S.p1.start ? ' (비교 안 함)' : ''}</text>`).join('');

    <tr><td>'기본' F1 (임계값 ${fmt(thr)})</td><td class="n">${fmt(ma.f1)}</td><td class="n">${fmt(mb.f1)}</td></tr>
    <tr><td>정답이 이 규칙인 텍스트 AUC (${gold.length}건): 원래 '규칙 문장만' → 새 문장${E.examples.length ? ' + 예시' : ''}</td><td class="n">${fmt(ra.auc)}</td><td class="n">${fmt(rb.auc)}</td></tr>
    <tr><td>같은 텍스트의 F1</td><td class="n">${fmt(ra.f1)}</td><td class="n">${fmt(rb.f1)}</td></tr></table>
    <div class="row"><div class="grow"><h3 style="color:var(--ok)">고쳐진 판정 ${fixed.length}</h3>${textRows(fixed, cols, 30)}</div><div class="grow"><h3 style="color:var(--viol)">새로 틀린 판정 ${broken.length}</h3>${textRows(broken, cols, 30)}</div></div>
    <p><button class="primary" id="p4save">수정안 저장</button> <button id="p4discard">수정안 버리기</button></p>`;
}
function proposals() { try { return JSON.parse(localStorage.getItem('rule_proposals') || '[]'); } catch (e) { return S._props || []; } }
function saveProposals(list) { S._props = list; try { localStorage.setItem('rule_proposals', JSON.stringify(list)); } catch (e) {} }
function p4Saved() {
  const L = proposals();
  if (!L.length) return '<div class="card"><h2>저장한 수정안 0건</h2><p class="hint">수정안을 저장하면 바꾼 내용과 전후 지표가 여기에 쌓입니다. 최종 규칙 개선안 3건의 근거로 씁니다.</p></div>';
  return `<div class="card"><h2>저장한 수정안 ${L.length}건 <button id="p4dl" style="float:right">JSON 내려받기</button></h2><table><tr><th>시각</th><th>규칙</th><th>판정기</th><th class="n">기본 AUC 전→후</th><th class="n">고쳐짐/새로 틀림</th><th></th></tr>
    ${L.map((p, k) => `<tr><td>${esc(p.time)}</td><td>${esc(short(nname(p.rule), 40))}</td><td>${esc(p.variant)}</td><td class="n">${fmt(p.metrics.base_before.auc)} → ${fmt(p.metrics.base_after.auc)}</td><td class="n">${p.metrics.fixed} / ${p.metrics.broken}</td><td><button data-del="${k}">삭제</button></td></tr>`).join('')}</table></div>`;
}
function bindP4() {
  const src = S.p4.src;
  $('p4src').onchange = e => { S.p4.src = e.target.value; S.p4.tau = null; S.p4.bnode = ''; S.p4.bv = 0; render(); };
  $('p4m').onchange = e => { S.p4.model = e.target.value; S.p4.thr = null; render(); };
  $('p4reset').onclick = () => { S.p4.thr = null; S.p4.tau = null; S.p4.bnode = ''; S.p4.bv = 0; render(); };
  $('p4thr').onchange = e => { S.p4.thr = +e.target.value; render(); };
  $('p4thr').oninput = e => { $('p4thrn').value = (+e.target.value).toFixed(4); };
  $('p4thrn').onchange = e => { S.p4.thr = Math.min(1, Math.max(0, +e.target.value)); render(); };
  const tau = $('p4tau'); tau.oninput = e => { tau.nextElementSibling.textContent = (+e.target.value).toFixed(3); }; tau.onchange = e => { S.p4.tau = +e.target.value; render(); };
  $('p4bnode').onchange = e => { S.p4.bnode = e.target.value; if (!e.target.value) S.p4.bv = 0; render(); };
  const bv = $('p4bv'); bv.oninput = e => { bv.nextElementSibling.textContent = (+e.target.value).toFixed(3); }; bv.onchange = e => { S.p4.bv = S.p4.bnode ? +e.target.value : 0; render(); };
  $('p4unit').onchange = e => { S.p4.unit = e.target.value; render(); };
  $('p4rule').onchange = e => { S.p4.rule = e.target.value; render(); };
  if ($('p4run')) $('p4run').onclick = () => rejudge(src);
  if ($('p4fill')) $('p4fill').onclick = () => fillMissing(src);
  if ($('p4save')) $('p4save').onclick = saveEdit;
  if ($('p4discard')) $('p4discard').onclick = () => { S.p4.edit = null; render(); };
  if ($('p4dl')) $('p4dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(proposals(), null, 2)], {type: 'application/json'})); a.download = 'rule_proposals.json'; a.click(); };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const L = proposals(); L.splice(+b.dataset.del, 1); saveProposals(L); render(); });
}
function parseExamples(s) {
  return s.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^([01])\s*[:：]\s*(.+)$/); return m ? [m[2], +m[1]] : null; }).filter(Boolean);
}
async function rejudge(src) {
  const m = S.p4.model, rule = $('p4rule').value, text = $('p4text').value.trim(), exText = $('p4ex').value, examples = parseExamples(exText);
  const ids = filtered({judged: true, noResult: true}).filter(i => TX.src[i] === src).map(i => TX.id[i]);
  S.p4.busy = true; render();
  try {
    const r = await fetch(API + '/api/rejudge', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({source: src, rule_id: rule, rule_text: text, examples, variant: variantOf(m), tau: D.meta.tau[src], start_level: D.meta.start_level || 2, text_ids: ids, top: TOP})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    const E = {id: Date.now(), src, rule, text, exText, examples, variant: variantOf(m), model: m, time: new Date().toLocaleString(), nJudged: j.n_judged,
      sims: new Map(Object.entries(j.sims).map(([t, v]) => [IDX.get(t), v]).filter(([i]) => i != null)),
      p: new Map(Object.entries(j.p).map(([t, v]) => [IDX.get(t), v])), extra: new Map(Object.entries(j.extra || {})),
      pEx: new Map(Object.entries(j.p_example || {}).map(([t, v]) => [IDX.get(t), v]))};   // 예시를 넣은 값은 정답 텍스트 비교에만
    P4C.clear(); S.p4.edit = E;
  } catch (e) { alertBox('다시 판정 실패: ' + e.message); }
  S.p4.busy = false; render();
}
async function fillMissing(src) {
  const m = S.p4.model, B = p4Base(src, m, S.p4.tau ?? D.meta.tau[src], {node: S.p4.bnode, v: S.p4.bv}, null);
  S.p4.busy = true;
  try {
    const r = await fetch(API + '/api/judge_pairs', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({variant: variantOf(m), pairs: B.miss})});
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText);
    const c = D.cache[variantOf(m)] = D.cache[variantOf(m)] || {}; Object.assign(c, j.p); P4C.clear();
  } catch (e) { alertBox('판정 실패: ' + e.message); }
  S.p4.busy = false; render();
}
async function saveEdit() {
  const E = S.p4.edit; if (!E) return;
  const rec = {time: E.time, source: E.src, rule: E.rule, rule_name: nname(E.rule), old_text: NODE.get(E.rule).text, new_text: E.text, examples: E.examples, variant: E.variant,
    settings: {tau: D.meta.tau[E.src], threshold: thrOf(E.src, E.model, 'base'), threshold_rule: S.thrBy}, metrics: E.summary};
  const L = proposals(); L.push(rec); saveProposals(L);
  if (S.server) { try { await fetch(API + '/api/proposals', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(rec)}); } catch (e) {} }
  render();
}
function alertBox(msg) { $('modalBody').innerHTML = `<h2>알림</h2><p>${esc(msg)}</p><button onclick="document.getElementById('modal').classList.remove('on')">닫기</button>`; $('modal').classList.add('on'); }

// ======================================================================= 그리기
function render() {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  const main = $('main');
  try {
    main.innerHTML = {p1: renderP1, p2: renderP2, p3: renderP3, p4: renderP4}[S.tab]();
    ({p1: bindP1, p2: bindP2, p3: bindP3, p4: bindP4})[S.tab]();
  } catch (e) { main.innerHTML = `<div class="card warn">그리기 오류: ${esc(e.message)}</div>`; console.error(e); }
  renderDetail();
  $('srv').innerHTML = S.server ? '<span class="chip ok">로컬 서버 연결됨 · 다시 판정 가능</span>' : '<span class="chip s">로컬 서버 없음 · 다시 판정 꺼짐</span>';
}
async function ping() { try { const r = await fetch(API + '/api/health', {cache: 'no-store'}); S.server = r.ok; } catch (e) { S.server = false; } render(); }
initFilters(); render(); ping();
</script>
</body>
</html>
